name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Security and repository hygiene
        run: python scripts/security_check.py
      - name: Preflight
        run: python scripts/preflight.py
      - name: Test
        run: python -m pytest -q
      - name: Deterministic backtest smoke test
        run: python -m backtesting.run_fast_backtest
